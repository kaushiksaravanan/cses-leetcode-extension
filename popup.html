<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSES LeetCode Interface</title>
  <script src="popup.js" defer></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 260px;
      padding: 20px;
      background-color: #1a1a2e;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
        Oxygen, Ubuntu, Cantarell, sans-serif;
      text-align: center;
    }

    h1 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 10px;
      color: #ffffff;
    }

    .icon {
      font-size: 36px;
      margin-bottom: 8px;
    }

    p {
      font-size: 13px;
      color: #a0a0b8;
      line-height: 1.5;
    }

    .status {
      margin-top: 16px;
      padding: 8px 12px;
      background-color: #16213e;
      border: 1px solid #2d2d4a;
      border-radius: 6px;
      font-size: 12px;
      color: #00b8a3;
    }

    .footer {
      margin-top: 14px;
      font-size: 11px;
      color: #4a4a6a;
    }
  </style>
</head>
<body>
  <div class="icon">⌨️</div>
  <h1>CSES LeetCode Interface</h1>
  <p>Open a CSES problem page<br/>(<strong>cses.fi/problemset/task/*</strong>)<br/>to use the code editor.</p>
  <div class="status" id="status">Extension Active</div>
  <div class="footer">v1.0.0</div>
</body>
</html>
